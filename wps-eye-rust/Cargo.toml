[package]
name = "wps-eye-comfort"
version = "1.1.0"
edition = "2021"
description = "Ultra-lightweight pure Rust + Direct2D WPS Eye Comfort controller with native 2025 dark skin and system tray"

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
